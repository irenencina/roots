<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roots</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Delius&family=Patrick+Hand+SC&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="masthead">
    <h1 class="wordmark">ROOTS</h1>
    <p class="tagline">Conscious places around us · prototype drawn from the Piemonte paper map</p>
  </header>
  <div class="map-wrap">
    <svg id="map" role="img" aria-label="Hand-drawn map of Piemonte and Valle d'Aosta with conscious places"></svg>
    <div class="zoom">
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="zoom-reset" type="button" aria-label="Show the whole map">⌂</button>
    </div>
  </div>
  <aside class="side" id="side">
    <div class="note" id="note" aria-live="polite"><p class="hint">Loading the map…</p></div>
    <nav class="legend" id="legend" aria-label="Places by category"></nav>
    <div class="unplaced" id="unplaced" hidden></div>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
