# Finds the train stations around the places (OpenStreetMap) and the way to the nearest ones,
# saved in data/stations.json. Runs whenever places change, or by hand from the Actions tab.
name: Build stations

on:
  push:
    paths:
      - data/places.json
      - tools/build_stations.py
      - tools/build_routes.py
      - .github/workflows/stations.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely
      - name: Find stations and route to them
        run: python3 tools/build_stations.py
      - name: Save the result
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/stations.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add data/stations.json
            git commit -m "Update train stations"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
